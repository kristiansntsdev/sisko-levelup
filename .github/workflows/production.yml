name: Production Deploy

on:
  push:
    tags:
      - 'release-*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      # Migrasi DB idempotent (cek dulu, baru CREATE/ADD): aman dijalankan tiap release, efektif hanya sekali per perubahan skema.
      # Wajib host www: levelupgen.com (308) + sisko.levelupgen.com (301) redirect ke www, curl tidak ikut redirect
      # dan tetap exit 0 ("Redirecting...") sehingga migrasi diam-diam tidak jalan. Selain HTTP 200 = gagal.
      - name: Run prod-migrate
        env:
          PROD_URL: https://www.levelupgen.com
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          code=$(curl -sS -o migrate.json -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 90 \
            -X POST "${PROD_URL}/api/internal/prod-migrate" \
            -H "Authorization: Bearer ${INTERNAL_API_SECRET}") || true
          cat migrate.json 2>/dev/null; echo
          [ "$code" = "200" ] || { echo "::error::prod-migrate HTTP ${code:-none}"; exit 1; }
