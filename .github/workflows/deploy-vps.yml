name: Deploy VPS

# Satu VPS, dua target:
#   push ke main        → dev        (dev.levelupgen.com, /var/www/sisko-levelup-dev, docker-compose.dev.yml)
#   push tag release-v* → production (www.levelupgen.com, /var/www/sisko-levelup,     docker-compose.yml)
# Run workflow manual: pilih branch main (= dev) atau tag release-v* (= production, juga untuk rollback ke rilis lama).
run-name: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'Production' || 'Dev' }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['release-v*']
  workflow_dispatch:

# Antrean per target: push main tidak pernah membatalkan / menahan rilis production yang sedang menunggu, dan sebaliknya.
concurrency:
  group: deploy-vps-${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || 'dev' }}
  cancel-in-progress: false

env:
  # Harus huruf kecil semua (aturan GHCR) dan sama dengan `image:` di kedua file compose.
  IMAGE: ghcr.io/kristiansntsdev/sisko-levelup
  PRODUCTION: ${{ startsWith(github.ref, 'refs/tags/release-v') }}

jobs:
  # Build di runner GitHub, bukan di VPS: VPS 3.8 GB tanpa swap dan berbagi dengan pphtgd,
  # `next build` di sana dibunuh OOM killer ("failed to execute bake: signal: killed").
  build:
    name: Build & push image
    # Run workflow dari branch lain: tidak ada target, tidak jalan.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag SHA = yang di-deploy job berikutnya. Tag kanal = default compose kalau dijalankan manual di VPS:
      # `dev` (docker-compose.dev.yml) untuk main, `latest` + nama tag rilis (docker-compose.yml) untuk production.
      - name: Image tags
        id: tags
        run: |
          if [ "$PRODUCTION" = true ]; then
            echo "extra=$IMAGE:latest,$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "extra=$IMAGE:dev" >> "$GITHUB_OUTPUT"
          fi

      # Rilis = promosi image yang sudah jalan di dev untuk commit yang sama: bit yang persis sama, tanpa build ulang
      # (image tidak bergantung env, semua env dibaca saat runtime). Belum ada (mis. commit tengah dari satu push
      # berisi beberapa commit, atau tag dibuat sebelum build main selesai) → build biasa di langkah berikutnya.
      - name: Promote dev image
        id: promote
        if: env.PRODUCTION == 'true'
        env:
          EXTRA: ${{ steps.tags.outputs.extra }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /dev/null 2>&1; then
            args=()
            IFS=',' read -ra extra <<< "$EXTRA"
            for t in "${extra[@]}"; do args+=(-t "$t"); done
            docker buildx imagetools create "${args[@]}" "$IMAGE:$GITHUB_SHA"
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "Image $GITHUB_SHA sudah ada, dipromosikan tanpa build ulang"
          else
            echo "Image $GITHUB_SHA belum ada di GHCR, build dulu"
          fi

      - uses: actions/checkout@v4
        if: steps.promote.outputs.done != 'true'

      # Label source: mengaitkan package ke repo ini (akses GITHUB_TOKEN) dan dipakai filter prune di VPS.
      - uses: docker/build-push-action@v6
        if: steps.promote.outputs.done != 'true'
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ steps.tags.outputs.extra }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || 'dev' }}
    needs: build
    runs-on: [self-hosted, Linux, sisko]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # Dibaca file compose: deploy persis image hasil build / promosi commit ini.
      IMAGE_TAG: ${{ github.sha }}
      # Variable repo (Settings → Secrets and variables → Actions → Variables): `true` = cron push ikut jalan di dev.
      DEV_PUSH_CRON: ${{ vars.DEV_PUSH_CRON }}
    steps:
      # Semua langkah berikutnya memakai `docker compose` biasa: COMPOSE_FILE memilih file compose target,
      # nama project (sisko-levelup / sisko-levelup-dev) memisahkan container kedua target.
      - name: Select target
        run: |
          if [ "$PRODUCTION" = true ]; then
            {
              echo "APP_DIR=/var/www/sisko-levelup"
              echo "COMPOSE_FILE=docker-compose.yml"
              echo "ENV_FILE=.env.production"
            } >> "$GITHUB_ENV"
          else
            {
              echo "APP_DIR=/var/www/sisko-levelup-dev"
              echo "COMPOSE_FILE=docker-compose.dev.yml"
              echo "ENV_FILE=.env.dev"
            } >> "$GITHUB_ENV"
            if [ "$DEV_PUSH_CRON" = true ]; then
              echo "COMPOSE_PROFILES=cron" >> "$GITHUB_ENV"
            fi
          fi

      # Folder + env hanya ada di VPS, tidak dari secret GitHub. Folder dev dibuat sekali secara manual.
      - name: Check folder and env file
        run: |
          [ -d "$APP_DIR/.git" ] || {
            echo "::error::$APP_DIR belum ada. Sekali saja di VPS: git clone \"\$(git -C /var/www/sisko-levelup remote get-url origin)\" $APP_DIR"
            exit 1
          }
          [ -s "$APP_DIR/$ENV_FILE" ] || { echo "::error::$APP_DIR/$ENV_FILE belum ada di VPS"; exit 1; }

      # Deploy langsung di APP_DIR (bukan workspace runner) supaya file env yang hanya ada di VPS tetap dipakai.
      # --ff-only: gagal kalau ada perubahan lokal yang bentrok, tidak pernah menimpa pekerjaan yang belum di-commit
      # di VPS. Rollback (tag lama) = "Already up to date": file compose tetap yang terbaru, image ikut tag lama.
      - name: Pull latest code
        run: |
          cd "$APP_DIR"
          git fetch origin
          git merge --ff-only "$GITHUB_SHA"

      # Login pakai GITHUB_TOKEN job ini (tidak perlu PAT). Kredensial ditaruh di folder temp
      # runner, bukan ~/.docker, jadi tidak tersisa di VPS setelah job selesai.
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-ghcr"
          mkdir -p "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Pull dulu, baru ganti container: kalau pull gagal, versi lama tetap jalan.
      - name: Pull image
        run: |
          cd "$APP_DIR"
          docker compose pull app

      # --wait: tunggu healthcheck app (GET /login) lolos; gagal = job merah.
      # Cron dev dimatikan (DEV_PUSH_CRON bukan true) → container cron lama ikut dihapus, bukan dibiarkan jalan.
      - name: Start containers
        run: |
          cd "$APP_DIR"
          if [ "$PRODUCTION" != true ] && [ "$DEV_PUSH_CRON" != true ]; then
            docker compose --profile cron rm -sf cron
          fi
          docker compose up -d --remove-orphans --wait --wait-timeout 300

      # Migrasi DB idempotent, dipanggil dari dalam container (tanpa lewat domain publik). Dev = DB dev, jadi
      # migrasi selalu dicoba di dev dulu sebelum rilis. INTERNAL_API_SECRET dibaca dari file env target.
      - name: Run prod-migrate
        run: |
          cd "$APP_DIR"
          docker compose exec -T app node -e '
            fetch("http://127.0.0.1:38417/api/internal/prod-migrate", {
              method: "POST",
              headers: { Authorization: "Bearer " + process.env.INTERNAL_API_SECRET },
              signal: AbortSignal.timeout(90000),
            }).then(async (r) => {
              console.log(await r.text());
              if (r.status !== 200) { console.log("::error::prod-migrate HTTP " + r.status); process.exit(1); }
            }).catch((e) => { console.log("::error::prod-migrate " + e.message); process.exit(1); });
          '

      - name: Show status
        if: always()
        run: |
          cd "$APP_DIR" 2>/dev/null || exit 0
          docker compose ps
          docker compose logs --tail 40 app || true

      # Hanya image sisko-levelup yang tidak dipakai container mana pun (dev maupun production tetap aman);
      # image project lain di VPS ini tidak disentuh. Versi lama tetap ada di GHCR kalau perlu rollback.
      - name: Prune old images
        run: |
          docker image prune -af --filter "label=org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          docker image prune -f

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true
