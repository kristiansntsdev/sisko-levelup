services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      TZ: Asia/Jakarta
    # Hanya di localhost: diakses cloudflared milik host (published route → http://localhost:38417),
    # tidak terbuka ke internet.
    ports:
      - "127.0.0.1:38417:38417"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38417/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
