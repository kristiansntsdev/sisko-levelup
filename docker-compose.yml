services:
  app:
    # Production: di-deploy deploy-vps.yml saat tag release-v* di-push (dev = docker-compose.dev.yml, dari main).
    # Image di-build GitHub Actions dan di-push ke GHCR; VPS hanya pull. `latest` = rilis terakhir.
    # Jangan build di VPS: RAM-nya tidak cukup untuk `next build`.
    image: ghcr.io/kristiansntsdev/sisko-levelup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      TZ: Asia/Jakarta
    # Hanya di localhost: diakses cloudflared milik host (published route → http://localhost:38417),
    # tidak terbuka ke internet.
    ports:
      - "127.0.0.1:38417:38417"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38417/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Pemicu push terjadwal (ulang tahun, pengingat event, absen online): memanggil app tiap 15 menit.
  # Image yang sama dengan app, tanpa build/image tambahan. Jendela jam + dedup (tabel push_kirim) ada di app,
  # jadi tick yang telat atau dobel aman. Butuh PUSH_CRON_SECRET di .env.production (sama dengan yang dibaca app).
  cron:
    image: ghcr.io/kristiansntsdev/sisko-levelup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      TZ: Asia/Jakarta
    depends_on:
      app:
        condition: service_healthy
    command:
      - node
      - -e
      - |
        const url = 'http://app:38417/api/internal/push-cron'
        const tick = () =>
          fetch(url, {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + (process.env.PUSH_CRON_SECRET || '') },
            signal: AbortSignal.timeout(120000),
          })
            .then(async (r) => console.log(new Date().toISOString(), r.status, (await r.text()).slice(0, 400)))
            .catch((e) => console.error(new Date().toISOString(), e.message))
        setTimeout(tick, 60000)
        setInterval(tick, 15 * 60 * 1000)
